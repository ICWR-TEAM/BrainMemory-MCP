[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmemory-mcp"
dynamic = ["version"]
description = "BrainMemory-MCP — a Model Context Protocol server exposing Cognitive memory tools over HTTP + SSE."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BrainMemory-MCP maintainers" }]
maintainers = [{ name = "BrainMemory-MCP maintainers" }]
keywords = ["mcp", "model-context-protocol", "memory", "sse", "cognitive", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0", "black>=24.0.0"]
build = ["build>=1.2.0", "twine>=5.0.0"]

[project.scripts]
brainmemory-mcp = "brainmemory_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/venturo/BrainMemory-MCP"
Repository = "https://github.com/venturo/BrainMemory-MCP"
Issues = "https://github.com/venturo/BrainMemory-MCP/issues"
Changelog = "https://github.com/venturo/BrainMemory-MCP/tree/main/docs/changelog"

[tool.setuptools.dynamic]
version = { attr = "brainmemory_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
